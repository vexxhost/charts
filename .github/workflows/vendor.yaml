name: Vendor

on:
  pull_request:
    paths:
      - "charts/cloudnative-pg/**"
      - "vendors/**"
      - "schemas/chart-vendor.schema.json"
      - "hack/vendor_charts.py"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/vendor.yaml"
  push:
    branches:
      - main
    paths:
      - "charts/cloudnative-pg/**"
      - "vendors/**"
      - "schemas/chart-vendor.schema.json"
      - "hack/vendor_charts.py"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/vendor.yaml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      - name: Verify vendored charts are reproducible
        run: nix develop --command uv run hack/vendor_charts.py --check
