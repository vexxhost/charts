name: publish

on:
  pull_request:
    paths:
      - "mirrors/**"
      - "schemas/**"
      - "hack/mirror_charts.py"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/mirror.yaml"
  push:
    branches:
      - main
    paths:
      - "mirrors/**"
      - "schemas/**"
      - "hack/mirror_charts.py"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/mirror.yaml"
  workflow_dispatch:
    inputs:
      chart:
        description: "Chart to mirror (name only, e.g. cert-manager)"
        required: false
        type: string
      version:
        description: "Version tag to mirror (e.g. v1.15.5)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      - name: Validate manifests and verify provenance
        run: nix develop --command uv run hack/mirror_charts.py --dry-run

  mirror:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      MIRROR_CHART: ${{ inputs.chart }}
      MIRROR_VERSION: ${{ inputs.version }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      - name: Login to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror charts
        run: nix develop --command uv run hack/mirror_charts.py
