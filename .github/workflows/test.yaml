name: Test

on:
  pull_request:
    paths:
      - "charts/**"
      - "ct.yaml"

permissions:
  contents: read

jobs:
  loopback-block:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ROOK_VERSION: v1.20.2
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: chart-testing

      - name: Install loopback-block chart
        run: |
          loopback_diagnostics() {
            kubectl -n kube-system get pods \
              -l app.kubernetes.io/instance=loopback-block -o wide || true
            kubectl -n kube-system describe daemonset/loopback-block || true
            kubectl -n kube-system describe pods \
              -l app.kubernetes.io/instance=loopback-block || true
            kubectl -n kube-system logs \
              -l app.kubernetes.io/instance=loopback-block \
              --all-containers=true --prefix=true || true
          }

          if ! helm install loopback-block charts/loopback-block/ \
            -f charts/loopback-block/ci/test-values.yaml \
            --namespace kube-system \
            --wait \
            --timeout=2m; then
            loopback_diagnostics
            exit 1
          fi
          if ! kubectl -n kube-system rollout status \
            daemonset/loopback-block --timeout=2m; then
            loopback_diagnostics
            exit 1
          fi
          kubectl -n kube-system logs \
            -l app.kubernetes.io/instance=loopback-block \
            --all-containers=true --prefix=true

      - name: Install rook-ceph operator
        run: |
          helm repo add rook-release https://charts.rook.io/release
          helm install rook-ceph rook-release/rook-ceph \
            --version "$ROOK_VERSION" \
            --namespace rook-ceph \
            --create-namespace \
            --set csi.enableRbdDriver=false \
            --set csi.enableCephfsDriver=false \
            --set allowLoopDevices=true \
            --wait \
            --timeout=5m

      - name: Deploy CephCluster
        run: |
          cat <<'EOF' | kubectl apply -f -
          apiVersion: ceph.rook.io/v1
          kind: CephCluster
          metadata:
            name: rook-ceph
            namespace: rook-ceph
          spec:
            cephVersion:
              # kind does not populate the udev database required by 19.2.4+.
              image: quay.io/ceph/ceph:v19.2.3
              allowUnsupported: true
            dataDirHostPath: /var/lib/rook
            mon:
              count: 1
              allowMultiplePerNode: true
            mgr:
              count: 1
              allowMultiplePerNode: true
            dashboard:
              enabled: false
            storage:
              useAllNodes: true
              useAllDevices: false
              devices:
                - name: loop100
          EOF

      - name: Wait for OSD
        run: |
          echo "Waiting for OSD pod to start..."
          for i in $(seq 1 60); do
            OSD_COUNT=$(kubectl -n rook-ceph get pod -l app=rook-ceph-osd --field-selector=status.phase=Running --no-headers 2>/dev/null | wc -l)
            if [ "$OSD_COUNT" -ge 1 ]; then
              echo "OSD pod is running (count: $OSD_COUNT)"
              kubectl -n rook-ceph get pod -l app=rook-ceph-osd
              exit 0
            fi
            echo "Attempt $i/60: OSD not ready yet (running: $OSD_COUNT)"
            sleep 10
          done
          echo "ERROR: OSD pod did not start within timeout"
          kubectl -n rook-ceph get pods
          kubectl -n rook-ceph describe pods -l app=rook-ceph-osd-prepare
          kubectl -n rook-ceph logs -l app=rook-ceph-osd-prepare \
            --all-containers=true --prefix=true || true
          kubectl -n rook-ceph logs deployment/rook-ceph-operator \
            --tail=500 || true
          kubectl -n kube-system get pods \
            -l app.kubernetes.io/instance=loopback-block -o wide
          kubectl -n kube-system logs \
            -l app.kubernetes.io/instance=loopback-block \
            --all-containers=true --prefix=true || true
          exit 1

  keycloak-operator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: chart-testing-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Install Keycloak Operator chart
        run: |
          helm install keycloak-operator charts/keycloak-operator \
            --namespace auth-system \
            --create-namespace \
            --values charts/keycloak-operator/ci/test-values.yaml \
            --wait \
            --timeout 5m
          kubectl wait \
            --for=condition=Established \
            crd/keycloaks.k8s.keycloak.org \
            crd/keycloakrealmimports.k8s.keycloak.org \
            --timeout=60s
          kubectl rollout status \
            deployment/keycloak-operator \
            --namespace auth-system \
            --timeout=5m

      - name: Verify CRDs are upgraded
        run: |
          helm upgrade keycloak-operator charts/keycloak-operator \
            --namespace auth-system \
            --reuse-values \
            --set-string 'crds.annotations.charts\.vexxhost\.com/upgrade-test=after' \
            --wait \
            --timeout 5m
          for crd in \
            keycloaks.k8s.keycloak.org \
            keycloakrealmimports.k8s.keycloak.org; do
            annotation=$(kubectl get crd "$crd" \
              --output go-template='{{ index .metadata.annotations "charts.vexxhost.com/upgrade-test" }}')
            test "$annotation" = "after"
          done

      - name: Verify CRDs are retained after uninstall
        run: |
          helm uninstall keycloak-operator --namespace auth-system
          kubectl get crd \
            keycloaks.k8s.keycloak.org \
            keycloakrealmimports.k8s.keycloak.org
